name: Automated LLM Testing Suite

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite Sequentially
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          echo "Running Accuracy Tests..."
          python -m pytest tests/test_accuracy.py
          sleep 18

          echo "Running Bias Tests..."
          python -m pytest tests/test_bias.py
          sleep 18

          echo "Running Hallucination Tests..."
          python -m pytest tests/test_hallucination.py
          sleep 18

          echo "Running Relevancy Tests..."
          python -m pytest tests/test_relevancy.py
          sleep 18

          echo "Running Toxicity Tests..."
          python -m pytest tests/test_toxicity.py
